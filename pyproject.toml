[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gaira"
version = "0.5.0"
description = "GAIRA — a frozen, reproducible biochemical coordinate system for Raman spectroscopy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "GAIRA" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
apps = ["streamlit>=1.40", "plotly>=5.20", "matplotlib>=3.7"]
benchmark = ["torch>=2.0"]      # only to re-run the representation benchmark

# ── V7 Phase 10 runtime platform ─────────────────────────────────────────────
# `runtime` is the minimum for the typed contract, the service and the SDK.
# `serve` adds the HTTP service; `mcp` the tool server; `platform` is everything.
runtime = ["pydantic>=2.7"]
serve = ["pydantic>=2.7", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
mcp = ["pydantic>=2.7", "mcp>=1.2"]
platform = [
    "pydantic>=2.7", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27",
    "mcp>=1.2", "streamlit>=1.40", "plotly>=5.20", "matplotlib>=3.7",
]

[project.scripts]
gaira = "gaira.v7.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gaira*"]

# The frozen model bundle (assets/foundation/) is data, loaded from the repo tree at
# runtime by gaira.engine.paths; it is not packaged as importable Python.
