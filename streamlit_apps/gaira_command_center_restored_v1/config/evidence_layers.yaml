# Evidence-stack layer definitions for the Overview tab.
# Each layer renders as a card with title / role / sources / artifact pointers.

pipeline_steps:
  - "Raw spectrum"
  - "Preprocessing"
  - "Spectral primitives"
  - "Raman physics atlas"
  - "MSS / motif grounding"
  - "11-axis BSV"
  - "ΔBSV"
  - "Candidate evidence"
  - "Interpretation report"

layers:
  - id: "grounding_corpus"
    title: "A. Grounding corpus"
    role: "Anchor data for analyte-level signatures (Raman + SERS)."
    sources:
      - "RamanBioLib (~202 pure Raman analytes)"
      - "Gobbato powder Raman (53 analytes × 3 reps)"
      - "amino acid Raman (aa.xlsx, 20 species)"
      - "digitized literature spectra"
      - "SERS metabolite references (NIHMS1547448)"
      - "OTC drug Raman (Paraguay iRaman 785, 300 spectra)"
    note: "440 grounding spectra across 5 core datasets after cleaning."

  - id: "literature_grounding"
    title: "B. Literature grounding"
    role: "Curated peak assignments + caveats from primary spectroscopy literature."
    sources:
      - "365 PMID-traceable motif registry entries (M2 ontology)"
      - "13 frozen Raman atlas zones"
      - "JACS 2025 chemical-space chemical-space SI"
      - "Bonifacio narrow-metabolite paper bands"
    note: "Literature is annotation-only. Never overrides MSS scoring."

  - id: "physics_atlas"
    title: "C. Raman physics atlas"
    role: "Band-family evidence + collision zones — the chemistry prior."
    sources:
      - "11 BSV biochemical family axes"
      - "13 frozen atlas bands (purine, pyrimidine, glycan, lipid, sterol, …)"
      - "Documented collision zones (G07/G09 aromatic-vs-sterol; G05/G06 glycan-vs-protein)"
    note: "Atlas is the prior. MSS evidence either confirms or competes against it."

  - id: "substrate_sers"
    title: "D. Substrate-aware SERS observation model"
    role: "SERS = substrate-conditioned Raman. Confidence modulation only."
    sources:
      - "47 substrate physics effects registry (Ag/Au colloid + sAg/sAu chip + Ag-film)"
      - "Per-method anchor reliability rules (cAg/cAu/sAg/sAu)"
      - "Substrate-aware adenine calibration wrapper"
    note: "Identity is never overridden by substrate; only confidence is modulated."

  - id: "mss_layer"
    title: "E. MSS / analyte layer"
    role: "Anchor + companion + anti-evidence + competitor scoring per molecule."
    sources:
      - "257 analyte-level MSS (post-decompression of 30 broad classes)"
      - "Per-MSS reliability tier (HIGH / MODERATE / LOW)"
      - "Local within-family competitor pairs (~983)"
    note: "Candidate-level evidence in complex biofluids; molecule identity only in pure contexts."

  - id: "bsv_layer"
    title: "F. 11-axis BSV layer"
    role: "Biochemical family-state representation."
    sources:
      - "G01 purine_nucleotide … G11 metabolic_small_molecule"
      - "Hybrid formula: 0.25·motif + 0.75·MSS aggregation"
      - "Confidence × magnitude × ambiguity"
    note: "BSV is the chemistry interpretation layer, not a quantitative classifier."

  - id: "delta_bsv"
    title: "G. ΔBSV"
    role: "Reference-relative biochemical state shift."
    sources:
      - "Cohort-reference ΔBSV"
      - "Family-centroid ΔBSV"
      - "Analyte-relative ΔBSV"
    note: "Reference computation always inside-fold to prevent leakage."

  - id: "optional_layers"
    title: "H. Optional layers"
    role: "Downstream heads — never required for core GAIRA interpretation."
    sources:
      - "Classifier (logreg / linSVM / RF on BSV+MSS features)"
      - "Drug detection (OTC MSS detector, default OFF)"
      - "Context graph (planned)"
    note: "Outputs framed at the appropriate evidence tier (PURE / CANDIDATE / NOT_DETECTED)."

bsv_taxonomy:
  - axis_id: "G01"
    name: "purine_nucleotide"
    representative: "adenine, guanine, AMP, GMP, ATP, GTP"
    bands: "720-740 (ring breath), 1336, 1480, 1576"
    caveat: "G01/G02 share many bands; ambiguity routing required."
  - axis_id: "G02"
    name: "purine_metabolite"
    representative: "uric acid, hypoxanthine, xanthine"
    bands: "640 (HX), 891 (UA distinctive), 1517 (UA carotenoid-overlap)"
    caveat: "UA 1517 ↔ carotenoid 1525 ambiguity in serum."
  - axis_id: "G03"
    name: "pyrimidine_nucleotide"
    representative: "cytosine, thymine, uracil, CMP, UMP, dCMP"
    bands: "780 (ring breath), 1240, 1660"
    caveat: "Within-pyrimidine analytes very similar (C/T/U)."
  - axis_id: "G04"
    name: "nucleic_acid_phosphate"
    representative: "DNA/RNA backbone, sugar-phosphate"
    bands: "1080-1100 (PO2-), 814 (RNA), 835 (B-DNA)"
    caveat: "Phosphate band shared with glycan C-O-C."
  - axis_id: "G05"
    name: "glycan_carbohydrate"
    representative: "glucose, fructose, sucrose, glycogen"
    bands: "1080 (anomeric), 1126, 1340, 1460"
    caveat: "C-O-C overlaps phosphate (G04)."
  - axis_id: "G06"
    name: "protein_peptide_backbone"
    representative: "albumin, collagen, peptides"
    bands: "1003 (Phe), 1450 (CH bend), 1655 (amide I), 1245 (amide III)"
    caveat: "Amide-I overlaps lipid C=C (G08); Phe overlaps aromatic (G07)."
  - axis_id: "G07"
    name: "aromatic_residue"
    representative: "Phe, Tyr, Trp"
    bands: "1003 (Phe), 853/828 (Tyr doublet), 759/1554 (Trp)"
    caveat: "1003 shared with G06 protein backbone."
  - axis_id: "G08"
    name: "lipid_acyl_membrane"
    representative: "palmitic, oleic, linoleic, phospholipids"
    bands: "1299 (CH2 twist), 1440 (CH2 bend), 1655 (C=C cis), 2850-2935 (CH stretch)"
    caveat: "1655 overlaps amide I (G06)."
  - axis_id: "G09"
    name: "sterol_neutral_lipid"
    representative: "cholesterol, cholesteryl ester, triglyceride"
    bands: "608, 700 (sterol skeletal), 1745 (ester C=O), 1080+1265 (cholesteryl ester)"
    caveat: "Triglyceride lacks 608/700; needs subfamily routing."
  - axis_id: "G10"
    name: "sulfur_thiol_redox"
    representative: "cysteine, cystine, glutathione, ergothioneine"
    bands: "510 (S-S), 660 (C-S), 912 (GSH), 1220 (ergo)"
    caveat: "GSH 912 overlaps sugar-anomeric region."
  - axis_id: "G11"
    name: "metabolic_small_molecule"
    representative: "lactate, urea, creatinine, citrate, glutamate"
    bands: "858 (lactate), 1003-1014 (urea), 605/685 (creatinine doublet)"
    caveat: "Sparse axis — many small molecules without dedicated atlas zones."
