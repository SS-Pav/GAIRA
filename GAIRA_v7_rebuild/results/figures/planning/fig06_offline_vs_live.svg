   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="12.96" y="26.227967" transform="rotate(-0 12.96 26.227967)">6 — Offline learning versus live inference</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="12.96" y="41.056255" transform="rotate(-0 12.96 41.056255)">The most important architectural line in the system. It exists to make spectra comparable across labs and years.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563eb" x="154.9152" y="80.81856" transform="rotate(-0 154.9152 80.81856)">OFFLINE  —  LEARNING MODE</text>
   </g>
