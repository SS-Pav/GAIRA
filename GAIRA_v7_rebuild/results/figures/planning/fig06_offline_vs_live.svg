   <g id="text_24">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(256.065234 330.162932)">WHY THE LINE IS ABSOLUTE</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(97.584961 339.985998)">Two spectra measured in different labs years apart are comparable only if projected onto the SAME FIXED AXES.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(86.425195 349.809064)">Any fitting at inference — even a PCA re-fitted 'just for the plot' — makes the coordinate system depend on the batch,</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(86.420508 359.632131)">and the comparison silently becomes meaningless.  Testable form: output must be identical alone and in a batch of N.</text>
   </g>
