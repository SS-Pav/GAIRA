   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="12.96" y="26.117087" transform="rotate(-0 12.96 26.117087)">10 — Future DART concept: BSV trajectories in a fixed coordinate system</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="12.96" y="40.413151" transform="rotate(-0 12.96 40.413151)">Conceptual schematic — no data. Illustrates why the BSV must be absolute, continuous, and non-negative.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6b7280" x="190.404" y="80.65224" transform="rotate(-0 190.404 80.65224)">fixed BSV coordinate system  (frozen atlas)</text>
   </g>
