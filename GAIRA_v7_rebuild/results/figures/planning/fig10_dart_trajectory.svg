    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; fill: #b45309" transform="translate(181.187109 143.490591)">ΔBSV</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; fill: #b45309" transform="translate(161.028867 152.00352)">(derived, signed)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(401.737903 106.308652)">EACH POINT IS AN ABSOLUTE BSV</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.4422 116.131718)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(406.931653 125.954785)">BSV(E, t) = Sᵀ c(x(E,t)) ∈ ℝ₊^K</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.4422 135.777851)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(379.09845 145.600918)">A trajectory is only meaningful because every</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(375.98595 155.423984)">point sits in the SAME fixed frame. The frame is</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(397.311145 165.24705)">frozen before the experiment starts.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(395.770544 197.682639)">DERIVED QUANTITIES  (none is a BSV)</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.4422 207.243756)"/>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(387.73313 216.804874)">displacement   BSV(tᵢ) − BSV(t₀)      signed</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(387.397786 226.365992)">velocity           d BSV / dt                  signed</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(398.293036 235.97342)">path length     Σ ‖BSV(tᵢ₊₁) − BSV(tᵢ)‖</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(392.981716 245.737569)">direction         normalised displacement</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(416.376505 273.52563)">WHAT DART MUST NOT DO</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.4422 283.086748)"/>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(411.472958 292.647866)">✗ trajectory-specific re-fitting</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(387.813544 302.208984)">✗ per-run normalisation  (breaks cross-run</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(395.169434 311.770102)">     comparability — the point of DART)</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(401.052778 321.33122)">✗ hard classification per time point</text>
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(385.729052 330.892338)">✗ cohort standardisation inside a trajectory</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="12.96" y="362.772059" transform="rotate(-0 12.96 362.772059)">Requirements this places on V7: absolute BSV · fixed frozen frame · continuous non-negative activations · per-point uncertainty · support-aware uncertainty inflation.</text>
   </g>
