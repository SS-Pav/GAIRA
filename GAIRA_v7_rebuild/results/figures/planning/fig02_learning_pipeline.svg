   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="12.96" y="28.223807" transform="rotate(-0 12.96 28.223807)">2 — V7 learning-mode pipeline (offline)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="12.96" y="52.632127" transform="rotate(-0 12.96 52.632127)">Every arrow is a defined computational operation. All fitting happens here and nowhere else.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(199.338425 74.505043)">Raw Raman grounding corpus</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(167.83905 84.982981)">375 spectra · 167 analytes · pure Raman only</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(210.9503 114.577075)">canonical preprocessing</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(182.99155 125.055013)">crop → resample → asls → savgol → L2</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="476.3232" y="119.484919" transform="rotate(-0 476.3232 119.484919)">unchanged from V5</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(155.672175 154.649107)">canonical molecule IDs · replicate groups · quality q</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(194.02155 165.127045)">frozen analyte-grouped CV splits</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="476.3232" y="159.556951" transform="rotate(-0 476.3232 159.556951)">Phase 00</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(194.57155 194.721139)">balanced reference construction</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(161.533425 205.199077)">select from {A control, B weighted, C prototype}</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="476.3232" y="199.628983" transform="rotate(-0 476.3232 199.628983)">Phase 01</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="259.3728" y="239.92089" transform="rotate(-0 259.3728 239.92089)">chemical-family partition   X → {X_c}</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="476.3232" y="239.701015" transform="rotate(-0 476.3232 239.701015)">organisational prior</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(155.193425 274.753953)">class-specific repeated non-negative decomposition</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(157.3028 285.231891)">X_c ≈ W_c H_c   ·   adaptive k_c   ·   R repeated fits</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="476.3232" y="279.773047" transform="rotate(-0 476.3232 279.773047)">Phase 02</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(204.39155 314.937235)">stable Local Spectral Motifs</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(147.73905 325.415173)">Hungarian alignment → recurrence → stability threshold</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="259.3728" y="360.248236" transform="rotate(-0 259.3728 360.248236)">LSM similarity graph   ·   6 edge features</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="476.3232" y="359.917111" transform="rotate(-0 476.3232 359.917111)">Phase 03</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(206.6878 395.081299)">Consensus Spectral Motifs</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(169.6953 405.559237)">integration method SELECTED ON EVIDENCE</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(186.62655 435.153331)">CSM → theme soft mapping   t = Sᵀc</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(179.8303 445.631269)">S sparse, non-negative, row-normalised</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="476.3232" y="440.061175" transform="rotate(-0 476.3232 440.061175)">Phase 04</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(194.7803 475.225363)">continuous BSV reference space</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(172.6403 485.703301)">reference stats · OOD support · uncertainty</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="476.3232" y="480.133207" transform="rotate(-0 476.3232 480.133207)">Phase 05</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(203.040925 515.266145)">FROZEN GAIRA V7 ATLAS</text>
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(178.31655 525.744083)">multi-layer fingerprint over 7 layers</text>
   </g>
   <g id="text_23">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="476.3232" y="520.205239" transform="rotate(-0 476.3232 520.205239)">Phase 06</text>
   </g>
   <g id="text_24">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(12.96 563.446177)">Fitting operations: NMF (per class) · graph construction · consensus clustering /</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(12.96 572.880318)">community detection · membership derivation · reference statistics · PCA (frozen view).</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(12.96 582.314459)">None of these ever runs at inference time.</text>
   </g>
  </g>
