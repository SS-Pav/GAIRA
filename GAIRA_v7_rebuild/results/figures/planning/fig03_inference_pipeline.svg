   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="12.96" y="27.447647" transform="rotate(-0 12.96 27.447647)">3 — V7 inference-mode pipeline (live)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="12.96" y="48.130399" transform="rotate(-0 12.96 48.130399)">Projection and arithmetic only. No fitting, no batch statistics, no RNG.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(194.87615 84.772531)">NEW RAMAN SPECTRUM</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(167.411775 95.250469)">wavenumbers · intensities · metadata</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(194.8799 127.683091)">canonical preprocessing</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(166.92115 138.161029)">crop → resample → asls → savgol → L2</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="452.2176" y="132.590935" transform="rotate(-0 452.2176 132.590935)">deterministic, per-spectrum</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(163.14865 170.457026)">fixed-dictionary non-negative projection</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(171.495525 180.985714)">c(x) = argmin_{c≥0} ‖x − cᵀ·CSM‖²</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="452.2176" y="175.501495" transform="rotate(-0 452.2176 175.501495)">NNLS</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(164.418025 213.504211)">CSM activation evidence   c(x) ∈ ℝ₊^M</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(139.2649 223.982149)">bands · supporting analytes · singleton/anchor flags</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="452.2176" y="218.412055" transform="rotate(-0 452.2176 218.412055)">lookup</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="243.3024" y="261.65374" transform="rotate(-0 243.3024 261.65374)">LSM activation evidence   [optional]</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="452.2176" y="261.322615" transform="rotate(-0 452.2176 261.322615)">explanation only</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="243.3024" y="304.5643" transform="rotate(-0 243.3024 304.5643)">soft biochemical themes   t(x) = Sᵀ c(x)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="452.2176" y="304.233175" transform="rotate(-0 452.2176 304.233175)">matrix multiply</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="243.3024" y="347.47486" transform="rotate(-0 243.3024 347.47486)">ABSOLUTE BSV   BSV(x) = t(x) ∈ ℝ₊^K</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="452.2176" y="347.143735" transform="rotate(-0 452.2176 347.143735)">not a delta, not a label</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(163.03365 385.146451)">reference comparison · QC · uncertainty</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(159.736775 395.624389)">elevation z · OOD · residual · band fidelity</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="452.2176" y="390.054295" transform="rotate(-0 452.2176 390.054295)">frozen affine + distances</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(182.974275 428.057011)">domain-context interpretation</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(164.4049 438.534949)">serum / EV / plasma / tissue / pathogen</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="452.2176" y="432.964855" transform="rotate(-0 452.2176 432.964855)">downstream only</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(12.96 493.545678)">PROHIBITED at inference: NMF fit · PCA fit · UMAP · clustering · community detection · ontology optimisation · threshold tuning on incoming data · any batch statistic.</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(12.96 502.979819)">General principle: a spectrum's output must be identical alone and in a batch of ten thousand.</text>
   </g>
  </g>
 </g>
