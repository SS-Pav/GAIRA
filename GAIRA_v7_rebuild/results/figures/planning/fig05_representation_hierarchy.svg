    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(426.996 311.016671)">identity</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; fill: #6b7280" transform="translate(426.996 319.791746)">BSV = t</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(215.486016 397.741885)">DERIVED FROM THE BSV — none of these is a BSV</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(90.318484 407.433977)">ΔBSV = BSV₂ − BSV₁  (signed)      ·      elevation z = (t−μ)/σ  (signed)      ·      cohort-standardised view  (visualisation)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(75.607516 417.12607)">DART trajectory BSV(E,t)  (sequence of absolute BSVs)      ·      PCA view y = Pᵀ(BSV−μ)  (visualisation; P applied, never fitted)</text>
   </g>
