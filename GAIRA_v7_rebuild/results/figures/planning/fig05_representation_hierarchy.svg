   <g id="text_1">
    <text style="font-weight: 700; font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="12.96" y="26.782367" transform="rotate(-0 12.96 26.782367)">5 — The V7 representation hierarchy: LSM → CSM → theme → BSV</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="12.96" y="44.271775" transform="rotate(-0 12.96 44.271775)">Each level is non-negative, provenance-carrying, and derived from the level below.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="78.0228" y="82.093153" transform="rotate(-0 78.0228 82.093153)">canonical Raman references</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="78.0228" y="96.703992" transform="rotate(-0 78.0228 96.703992)">ℝ₊^676 per canonical molecule · balanced</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="78.0228" y="146.957953" transform="rotate(-0 78.0228 146.957953)">Local Spectral Motifs (LSMs)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="78.0228" y="161.467276" transform="rotate(-0 78.0228 161.467276)">H_c ∈ ℝ₊^{k_c×676} · learned per class · stability-selected</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="78.0228" y="211.822753" transform="rotate(-0 78.0228 211.822753)">Consensus Spectral Motifs (CSMs)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="78.0228" y="226.433592" transform="rotate(-0 78.0228 226.433592)">CSM ∈ ℝ₊^{M×676} · cross-class consensus · THE EVIDENCE UNIT</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="78.0228" y="276.687553" transform="rotate(-0 78.0228 276.687553)">biochemical themes</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="78.0228" y="291.298392" transform="rotate(-0 78.0228 291.298392)">t = Sᵀc · S ∈ ℝ₊^{M×K} sparse, non-negative, row-normalised</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="78.0228" y="341.552353" transform="rotate(-0 78.0228 341.552353)">Biochemical State Vector</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="78.0228" y="356.163192" transform="rotate(-0 78.0228 356.163192)">BSV ∈ ℝ₊^K · ABSOLUTE · fixed global coordinate system</text>
   </g>
