   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="12.96" y="26.624205" transform="rotate(-0 12.96 26.624205)">1 — Canonical V7 Phase 01 pipeline</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="12.96" y="44.496798" transform="rotate(-0 12.96 44.496798)">Balanced references → split by chemistry class → independent class-local NMF → Local Spectral Motifs</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(201.798731 63.193454)">Raman grounding corpus</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(175.627903 73.409443)">375 spectra · 154 canonical molecules</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="454.0032" y="68.080699" transform="rotate(-0 454.0032 68.080699)">Phase 00</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(164.567138 121.383278)">BALANCED REFERENCE CONSTRUCTION</text>
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(155.035903 131.599267)">8 arms compared · one molecule = one unit</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="454.0032" y="126.270523" transform="rotate(-0 454.0032 126.270523)">Stage 1</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(205.133841 179.573102)">split by chemistry class</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(183.460809 189.789091)">16 independent per-class datasets</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(177.686981 237.654457)">INDEPENDENT CLASS-LOCAL NMF</text>
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(136.26045 247.870446)">X_c ≈ W_c H_c · adaptive k_c · no global competition</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="454.0032" y="242.650171" transform="rotate(-0 454.0032 242.650171)">Stage 2</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(195.009684 295.844281)">LOCAL SPECTRAL MOTIFS</text>
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(196.151044 306.06027)">33 retained · rows of H_c</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(177.235919 372.402681)">Phase 02 — Consensus Spectral Motifs</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(224.477044 382.356721)">NOT STARTED</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(216.12485 423.549205)">THE FROZEN V5 ATLAS IS NOT AN INPUT (principle P-15)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(174.921881 433.241298)">It is loaded only to verify its fingerprint and to serve as a baseline comparator.</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(196.130975 442.93339)">Its 24 components appear nowhere in the construction of any LSM.</text>
   </g>
  </g>
