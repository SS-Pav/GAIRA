   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="12.96" y="26.069805" transform="rotate(-0 12.96 26.069805)">1 — Canonical molecule resolution workflow</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="12.96" y="41.392158" transform="rotate(-0 12.96 41.392158)">Identity is a metadata layer: the corpus stays 375/167, CV groups by canonical_id.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(146.6169 65.059033)">observed surface forms</text>
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(156.939103 75.275022)">167 analyte names</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(158.240728 107.881667)">step 1  MECHANICAL</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(128.805478 118.097656)">Unicode NFKC + whitespace + case</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(129.217416 128.313646)">→ collapses the U+FB02 'ﬂ' ligature</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(144.989259 155.781827)">step 2  DECLARED MERGES</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(123.091978 165.997816)">13 duplicate pairs from the V6.3 audit,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(112.072041 176.213806)">each re-audited with a chemical justification</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(160.475916 203.681987)">step 3  PROTECTED</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(120.707494 213.897976)">enantiomers &amp; anomers NEVER merged</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(139.014947 224.113966)">(+)-arabinose ≠ (−)-arabinose</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(165.411853 251.582147)">step 4  FLAGGED</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(122.179134 261.798136)">near-misses recorded as UNRESOLVED,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(155.925103 272.014126)">never merged silently</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(148.347525 304.590302)">canonical molecule IDs</text>
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(167.046806 314.806291)">154 molecules</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(425.563889 71.849853)">WHAT THE MERGE REMOVED</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(480.1176 81.672919)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(435.293967 91.495986)">surface forms          167</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(430.111936 101.319052)">canonical molecules    154</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(435.842405 111.142118)">merged forms           13</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(480.1176 120.965185)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(425.535178 130.788251)">CROSS-SOURCE merges    11</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(436.332248 140.611318)">spectra affected       49</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(480.1176 150.434384)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(408.88635 160.25745)">A cross-source merge is one molecule</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(405.432834 170.080517)">that appeared in two reference libraries</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(411.67717 179.903583)">under two spellings. Grouping CV by</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(400.852561 189.72665)">surface name would score it against itself.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(436.73303 240.107999)">EXPLICIT NON-MERGES</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(480.1176 249.931065)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(412.123655 259.754132)">protected (enantiomer / anomer)   3</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(422.646506 269.577198)">unresolved, flagged               1</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(480.1176 279.400264)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(405.558811 289.223331)">Every non-merge is a recorded decision</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(405.940842 299.046397)">with a reason, so a reader can disagree</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(467.266819 308.869464)">with it.</text>
   </g>
  </g>
 </g>
