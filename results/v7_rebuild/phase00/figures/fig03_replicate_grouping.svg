    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #6b7280" x="218.9736" y="291.49056" transform="rotate(-0 218.9736 291.49056)">spectra per replicate group</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="59.3856" y="83.9232" transform="rotate(-0 59.3856 83.9232)">replicate-group size distribution  (v7 key)</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(375.372131 115.904418)">key                             groups  median  max  singletons</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(372.596006 124.590585)">v5  analyte|source|excitation      272     1.0    3         220</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(374.526506 133.460315)">v7  canonical_id|excitation        231     1.0    6         179</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(410.967225 173.584035)">WHY (canonical_id, excitation)</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.6096 183.214429)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(382.425412 192.644572)">The V5 key also split on SOURCE, so the same</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(379.912163 202.074716)">molecule measured at 785 nm in two reference</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(414.708975 211.50486)">libraries formed two groups.</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.6096 220.935004)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(375.183225 230.365147)">Under the V7 key those are one replicate group —</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(380.133225 239.795291)">which is what a replicate is: the same molecule</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(391.875975 249.225435)">under the same measurement condition.</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.6096 258.655579)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(391.081725 268.085722)">Excitation stays in the key because it is a</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(389.733412 277.515866)">tracked nuisance factor: peak POSITION is</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(382.720163 286.94601)">excitation-invariant, relative INTENSITY is not.</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(465.6096 296.376154)"/>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(374.97285 305.806297)">Balancing applies per canonical molecule ACROSS</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(379.930162 315.236441)">its groups, so the 41 multi-excitation molecules</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(428.333287 324.666585)">buy no extra weight.</text>
   </g>
