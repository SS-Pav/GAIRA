   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1a1a1a" x="12.96" y="25.626285" transform="rotate(-0 12.96 25.626285)">3 — Replicate grouping: which spectra are one measurement?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6b7280" x="12.96" y="38.908446" transform="rotate(-0 12.96 38.908446)">Ratified key: (canonical_id, excitation). Balancing then applies per molecule ACROSS groups.</text>
   </g>
