packs:
  GAIRA_EV:
    pack_id: GAIRA_EV
    role: ev_foundation_pack
    status: active_scaffold
    intended_sample_types:
      - extracellular vesicles
    intended_matrices:
      - plasma EV
      - EV-like SERS datasets
    datasets:
      - small2023_ev
      - shine_ev_sers
      - diabetes_plasma_ev_sers
    default_embedding: small2023_ev_v1
    notes: >
      EV-focused GAIRA foundation pack for biosample benchmarking and downstream EV inference work.
      Uses small2023_ev_v1 as the current default downstream embedding for EV-domain work.

  GAIRA_SERUM:
    pack_id: GAIRA_SERUM
    role: serum_foundation_pack
    status: active_scaffold
    intended_sample_types:
      - serum
    intended_matrices:
      - serum
    datasets:
      - hcc_serum
      - serum_ag_colloids
      - serum_protocol_comparison
      - cspp_serum
      - ergothioneine_serum
      - covid_serum_raman
      - cca_hcc_lm_serum_sers
    holdout_datasets:
      - hcc_serum
    default_embedding: none_yet
    notes: >
      Serum-focused GAIRA foundation pack for biosample benchmarking and future serum inference work.
      hcc_serum is retained as a holdout evaluation dataset and is skipped by default in rebuild
      and ingest flows unless explicitly requested. The active rebuilt serum stack currently
      centers serum_ag_colloids, serum_protocol_comparison, cspp_serum, and ergothioneine_serum.
      covid_serum_raman is onboarded as a spontaneous-Raman serum cohort dataset and should be
      interpreted with modality caution relative to the SERS-heavy serum stack. No serum embedding
      is promoted to default yet.

  GAIRA_GROUNDING:
    pack_id: GAIRA_GROUNDING
    role: shared_grounding_pack
    status: active_scaffold
    intended_sample_types:
      - shared molecular grounding
    intended_matrices:
      - shared grounding layer
    datasets:
      - ramanbiolib
      - serum_ag_colloids_grounding
      - adenine_sers_control
      - metabolite_sers63_support
      - amino_acid_raman_grounding
      - serum_ag_colloids_literature_grounding
      - sers_fingerprint_workingpaper_support
      - sers24_metabolite_support
    notes: >
      Shared molecular, perturbation, and literature-backed grounding pack. This pack is intended
      to support multiple biosample-domain foundation packs without being treated itself as a
      biosample inference or benchmarking pack. It currently includes RamanBioLib and the selected
      controlled-reference folders extracted from the serum_ag_colloids archive, plus the deferred
      literature and digitized-literature support assets from the same release, plus calibration-like
      controlled analyte grounding such as adenine_sers_control, plus support-only paper resources
      where no clean numeric spectral package was released.
