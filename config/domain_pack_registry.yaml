packs:
  GAIRA_EV:
    pack_id: GAIRA_EV
    role: ev_foundation_pack
    status: active_scaffold
    intended_sample_types:
      - extracellular vesicles
    intended_matrices:
      - plasma EV
      - EV-like SERS datasets
    datasets:
      - small2023_ev
      - shine_ev_sers
      - diabetes_plasma_ev_sers
    default_embedding: small2023_ev_v1
    notes: >
      EV-focused GAIRA foundation pack for biosample benchmarking and downstream EV inference work.
      Uses small2023_ev_v1 as the current default downstream embedding for EV-domain work.

  GAIRA_SERUM:
    pack_id: GAIRA_SERUM
    role: serum_foundation_pack
    status: active_scaffold
    intended_sample_types:
      - serum
    intended_matrices:
      - serum
    datasets:
      - hcc_serum
      - serum_ag_colloids
    default_embedding: none_yet
    notes: >
      Serum-focused GAIRA foundation pack for biosample benchmarking and future serum inference work.
      hcc_serum is the first onboarded serum biosample benchmark-style dataset, and
      serum_ag_colloids is the second onboarded serum biosample dataset with a more
      biochemical-interpretation-oriented release structure. No serum embedding is promoted
      to default yet.

  GAIRA_GROUNDING:
    pack_id: GAIRA_GROUNDING
    role: shared_grounding_pack
    status: active_scaffold
    intended_sample_types:
      - shared molecular grounding
    intended_matrices:
      - shared grounding layer
    datasets:
      - ramanbiolib
      - serum_ag_colloids_grounding
    notes: >
      Shared molecular, perturbation, and literature-backed grounding pack. This pack is intended
      to support multiple biosample-domain foundation packs without being treated itself as a
      biosample inference or benchmarking pack. It currently includes RamanBioLib and the selected
      controlled-reference folders extracted from the serum_ag_colloids archive.
